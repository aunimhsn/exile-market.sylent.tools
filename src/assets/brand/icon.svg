<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="12 12 76 76" width="256" height="256">
  <!-- Exile Market icon: the emblem (emblem.svg) in flat colors, the rings in the deep red of the site
       and the diamonds in its red, the two accent colors of src/styles/tokens.css, the same in dark and
       light modes (docs/branding.md, Icon and preview card). `npm run brand:images` makes the images of the
       site from it; the application copies it to assets/logo/icon.svg. -->
  <defs>
    <path id="blade" d="M50 13 L54.6 21 L50 31 L45.4 21 Z"/>
    <path id="small-blade" d="M50 14 L53 22 L50 28 L47 22 Z"/>
  </defs>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#a80f18" stroke-width="5"/>
  <circle cx="50" cy="50" r="21.5" fill="none" stroke="#a80f18" stroke-width="1.5" opacity=".55"/>
  <g fill="#e5383b">
    <use xlink:href="#blade"/>
    <use xlink:href="#blade" transform="rotate(90 50 50)"/>
    <use xlink:href="#blade" transform="rotate(180 50 50)"/>
    <use xlink:href="#blade" transform="rotate(270 50 50)"/>
    <use xlink:href="#small-blade" transform="rotate(45 50 50)"/>
    <use xlink:href="#small-blade" transform="rotate(135 50 50)"/>
    <use xlink:href="#small-blade" transform="rotate(225 50 50)"/>
    <use xlink:href="#small-blade" transform="rotate(315 50 50)"/>
    <path d="M50 39 L58 50 L50 61 L42 50 Z"/>
  </g>
</svg>

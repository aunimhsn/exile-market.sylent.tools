<!doctype html>
<!--
  The card that LinkedIn, Facebook and the messaging apps show for a link to the site, drawn at
  1200 × 630 px by `npm run brand:images` into social-card.png. One image for both languages, so
  no sentence on it: the description beside it is translated. The important part stays away from
  the edges, since some apps crop the card to a square. Manrope is read from Google Fonts only
  when the image is drawn; the site never loads this page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Preview card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;800&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }

      body {
        position: relative;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 24px;
        background: #0a0a0a;
        color: #ffffff;
        font-family: Manrope, system-ui, sans-serif;
      }

      /* The grid of the first screen of the site, faded towards the middle. */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(#ffffff14 1px, transparent 1px),
          linear-gradient(90deg, #ffffff14 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(closest-side, transparent 45%, #000000);
      }

      img,
      p,
      small {
        position: relative;
      }

      img {
        width: 168px;
        height: 168px;
      }

      p {
        margin: 0;
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.15;
        text-transform: uppercase;
      }

      small {
        color: #a3a3a3;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <img src="emblem.svg" alt="" />
    <p>Exile Market</p>
    <small>exile-market.sylent.tools</small>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exile Market: mock-up of the site</title>
<!--
  Mock-up of the site (html-mockups skill): the home page, the legal notice and the not-found page. It is the visual reference of the build.

  Opened alone, this page is a shell: the tabs of the open decisions, and the page itself in an
  iframe at the size of a real browser window. With ?embed=1, it is the page alone.
  - The style is settled (docs/branding.md); the tabs hold what is still open, and the states.
  - The video is the real one, rendered from docs/mockups/video/; the details of the legal notice are samples.
  Serve the repository root: python3 docs/mockups/serve.py 8770
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
  /* The design tokens, in one place; they become src/styles/tokens.css once the mock-up is approved. */
  :root {
    /* Spacing: --space-N = N × 4 px. */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
    --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px; --space-20: 80px;

    /* Type: one size per role. */
    --font-text: Manrope, system-ui, sans-serif;
    --font-title: Manrope, system-ui, sans-serif;
    --weight-text: 400;
    --weight-title: 800;
    --tracking-title: -0.045em;
    --tracking-button: 0.01em;
    --size-display: clamp(34px, 3.8vw, 54px);
    --size-title: clamp(26px, 2.6vw, 38px);
    --size-subtitle: 19px;
    --size-body: 16px;
    --size-label: 14px;
    --line-body: 1.55;
    --line-title: 1.15;

    /* Colors: neutral blacks and white; red only on what follows the pointer and on two links. */
    --color-background: #0a0a0a;
    --color-band: #0d0d0d;
    --color-surface: #1a1a1a;
    --color-border: #262626;
    --color-text: #ffffff;
    --color-text-weak: #a3a3a3;
    /* Text around a link without an underline: 3.7:1 against the white link, 5.3:1 against the background. */
    --color-text-faint: #858585;
    --color-link-line: #858585;
    --color-focus: #ffffff;
    --color-frame-line: #ffffff17;
    --color-button-line: #404040;
    --color-card: #ffffff09;
    --color-card-line: #ffffff17;
    --color-accent-deep: #a80f18;
    --color-accent: #e5383b;
    /* The line that draws itself around a download button: it starts fast and slows down. */
    --draw-in: .7s cubic-bezier(.215, .61, .355, 1);
    --draw-out: .25s ease-out;
    --video-neutral: #161616;

    /* Layout and shapes. */
    --width-content: 1120px;
    --width-text: 68ch;
    --gutter: var(--space-5);
    --card-padding: var(--space-6);
    --band-padding: var(--space-20);
    --heading-gap: var(--space-8);
    /* The same gap above and below the links of the download area. */
    --download-rhythm: var(--space-3);
    --radius-small: 2px;
    --grid-image: linear-gradient(#ffffff0d 1px, transparent 1px), linear-gradient(90deg, #ffffff0d 1px, transparent 1px);
    /* The grid of the hero holds the upper half and fades out towards it. */
    --grid-fade: linear-gradient(to bottom, #000 20%, transparent 50%);
    /* What the first screen holds besides the video, and the title of the next block. */
    --first-screen-rest: 380px;
    --video-ceiling: 960px;
  }

  /* The shell around the page: neutral, so that it doesn't compete with the style. */
  body { margin: 0; }
  body.is-shell { display: flex; flex-direction: column; height: 100svh; background: #24272b; color: #e9ecef; font: 13px/1.4 system-ui, sans-serif; }
  .page-panel { flex: none; background: #1b1d20; border-bottom: 1px solid #3a3f45; }
  .page-panel > summary { padding: 8px 14px; color: #adb5bd; cursor: pointer; }
  .page-tabs { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 14px 10px; }
  .page-group { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
  .page-group > span { margin-right: 3px; color: #adb5bd; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .page-group button { padding: 3px 8px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-group button[aria-pressed="true"] { border-color: #e9ecef; background: #e9ecef; color: #1b1d20; }
  .page-group a { color: #adb5bd; }
  .page-group select { padding: 3px 6px; border: 1px solid #e9ecef; border-radius: 4px; background: #24272b; color: #e9ecef; font: inherit; }
  .page-stage { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .page-device { margin: 0 auto; overflow: hidden; box-shadow: 0 0 0 1px #4a5056; }
  .page-device iframe { display: block; border: 0; transform-origin: 0 0; }
  .page-stage.is-fill { padding: 0; }
  .page-stage.is-fill .page-device { width: 100%; height: 100%; box-shadow: none; }
  .page-stage.is-fill iframe { width: 100%; height: 100%; }

  /* The page. */
  body.is-page { background: var(--color-background); color: var(--color-text); font: var(--weight-text) var(--size-body)/var(--line-body) var(--font-text); -webkit-font-smoothing: antialiased; }
  .site-container { box-sizing: border-box; width: min(100%, calc(var(--width-content) + 2 * var(--gutter))); margin: 0 auto; padding: 0 var(--gutter); }
  main { overflow-x: clip; }
  a { color: var(--color-text); text-decoration-color: var(--color-link-line); text-underline-offset: 3px; transition: color .2s; }
  a:hover { color: var(--color-accent); text-decoration-color: currentcolor; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }
  h1, h2 { margin: 0; color: var(--color-text); font-family: var(--font-title); font-weight: var(--weight-title); letter-spacing: var(--tracking-title); line-height: var(--line-title); }
  h1 { font-size: var(--size-display); text-shadow: 0 2px 18px #000; text-wrap: balance; }
  h2 { font-size: var(--size-title); text-transform: uppercase; }
  h3 { margin: 0; color: var(--color-text); font-size: var(--size-body); font-weight: 600; line-height: 1.35; }
  p { margin: 0; }
  ol, ul { margin: 0; padding: 0; list-style: none; }
  kbd { padding: 1px 5px; border: 1px solid var(--color-border); border-radius: var(--radius-small); background: var(--color-surface); font: 600 .84em/1 var(--font-text); white-space: nowrap; }
  code { font: 700 1em var(--font-text); }

  .site-top-zone { position: relative; z-index: 1; }
  .site-header { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .site-brand { display: flex; align-items: center; gap: var(--space-2); color: var(--color-text); font-family: var(--font-title); font-size: 17px; font-weight: var(--weight-title); letter-spacing: var(--tracking-title); text-decoration: none; text-transform: uppercase; }
  .site-brand svg { width: 26px; height: 26px; filter: grayscale(1) brightness(1.7); }
  /* The flag alone (owner's choice), with its name for screen readers and under the pointer. */
  .site-language { display: grid; place-items: center; width: 44px; height: 44px; margin-right: -8px; }
  .site-language svg { width: 28px; height: 19px; box-shadow: 0 0 0 1px #ffffff33; transition: transform .15s; }
  .site-language:hover svg { transform: scale(1.1); }

  .hero-wrap { position: relative; isolation: isolate; background: radial-gradient(60% 44% at 50% 22%, #0a0a0af0 55%, transparent); }
  .hero-wrap::before, .hero-fluid { content: ""; position: absolute; z-index: -1; inset: -56px 0 0; background-size: 32px 32px; pointer-events: none; }
  .hero-wrap::before { background-image: var(--grid-image); -webkit-mask-image: var(--grid-fade), linear-gradient(to right, #0006, #000 26%, #000 74%, #0006); mask-image: var(--grid-fade), linear-gradient(to right, #0006, #000 26%, #000 74%, #0006); -webkit-mask-composite: source-in; mask-composite: intersect; }
  /* The grid in red under the pointer. */
  .hero-fluid { background-image: linear-gradient(var(--color-accent-deep) 1px, transparent 1px), linear-gradient(90deg, var(--color-accent-deep) 1px, transparent 1px); opacity: 0; transition: opacity .4s; -webkit-mask-image: var(--grid-fade), radial-gradient(190px circle at var(--mx, 50%) var(--my, 50%), #000, transparent); mask-image: var(--grid-fade), radial-gradient(190px circle at var(--mx, 50%) var(--my, 50%), #000, transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
  .hero-fluid.is-lit { opacity: 1; }
  .hero-price { color: var(--color-accent); }
  .hero { display: flex; flex-direction: column; align-items: center; padding: var(--space-3) 0 var(--band-padding); text-align: center; }
  .hero-subtitle { max-width: 100%; margin-top: var(--space-2); color: var(--color-text-weak); font-family: var(--font-subtitle, var(--font-text)); font-size: calc(var(--size-subtitle) * var(--subtitle-scale, 1)); font-style: var(--subtitle-style, normal); font-weight: var(--subtitle-weight, 500); line-height: 28px; text-shadow: 0 1px 10px #000, 0 0 3px #000; text-wrap: balance; }
  .download { display: flex; flex-direction: column; align-items: center; gap: var(--download-rhythm); margin-top: var(--space-4); }
  .download-buttons { display: inline-grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .download-button { display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 var(--space-6); border: 1px solid var(--color-button-line); color: var(--color-text); font-family: var(--font-title); font-weight: 600; letter-spacing: var(--tracking-button); text-decoration: none; white-space: nowrap; transition: background-color .12s, color .12s; }
  .download-button:hover { color: var(--color-text); }
  .download-button.is-main { border-color: var(--color-text); }
  /* A red line with a glow over the border, drawn clockwise under the pointer or the keyboard focus. */
  .download-button { position: relative; }
  .button-line { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); overflow: visible; pointer-events: none; }
  /* The glow sits behind the text of the button. */
  .button-line.is-glow { z-index: -1; filter: drop-shadow(0 0 3px var(--color-accent-deep)) drop-shadow(0 0 10px var(--color-accent-deep)); }
  .button-line rect { x: 1px; y: 1px; width: calc(100% - 2px); height: calc(100% - 2px); fill: none; stroke: var(--color-accent-deep); stroke-width: 2px; stroke-linecap: square; stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset var(--draw-out), opacity 0s linear .25s; }
  .download-button:hover .button-line rect, .download-button:focus-visible .button-line rect { stroke-dashoffset: 0; opacity: 1; transition: stroke-dashoffset var(--draw-in), opacity 0s; }
  :root[data-motion="still"] .button-line rect { transition: none; }
  .download-message { max-width: 44ch; font-weight: 600; }
  .download-address { white-space: nowrap; }
  /* One link per line, red, white under the pointer, without an underline. */
  .download-links { display: grid; justify-items: center; gap: var(--space-1); font-family: var(--font-title); font-size: 13px; font-weight: 700; line-height: 1.3; text-shadow: 0 1px 10px #000, 0 0 3px #000; }
  .download-links a { color: var(--color-accent); text-decoration: none; }
  .download-links a:hover { color: var(--color-text); }

  /* The video stays whole: its width follows the height of the window, with a ceiling. */
  .hero-video { position: relative; width: min(100%, clamp(400px, calc((100svh - var(--first-screen-rest)) * 16 / 9), var(--video-ceiling))); margin-top: var(--download-rhythm); perspective: 1100px; }
  .media-frame { position: relative; overflow: hidden; outline: 1px solid var(--color-frame-line); outline-offset: -1px; text-align: left; }
  .media-frame.is-video { aspect-ratio: 16 / 9; }
  .media-video { display: block; width: 100%; height: 100%; }
  .hero-video .media-frame { transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); transition: transform .12s ease-out; }
  .media-frame.is-shot { aspect-ratio: 4 / 3; }
  .media-grey { display: grid; place-items: center; height: 100%; padding: var(--space-4); box-sizing: border-box; background: var(--color-surface); color: var(--color-text-weak); font-size: var(--size-label); text-align: center; }
  .media-pause { position: absolute; right: var(--space-2); bottom: var(--space-2); display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 3px; background: #0f1216cc; color: #f2f5f9; cursor: pointer; }
  .media-play { position: absolute; inset: 0; margin: auto; display: grid; place-items: center; width: 64px; height: 64px; border: 0; border-radius: 50%; background: #0f1216e6; color: #f2f5f9; cursor: pointer; }

  .band { padding: var(--band-padding) 0; background: var(--color-background); }
  .band.is-alt { background: var(--color-band); }
  /* The sentence has no border above or below it: only the background of its band sets it apart. */
  .band-heading { display: grid; min-width: 0; margin-bottom: var(--heading-gap); }
  .band-heading > * { grid-area: 1 / 1; }
  .band-heading h2 { position: relative; align-self: start; }
  /* Centered like the first screen; on a phone, both stay on the left. */
  @media (min-width: 721px) { .band-heading { justify-items: center; text-align: center; } }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* What it does: three real screens of the application side by side, overlapping; on a computer, the text of the card in front stands on their right, aligned on the left. */
  .deck { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--space-12); align-items: center; }
  /* The cards follow the width of their column, so that they never reach the text. */
  .deck-stage { container-type: inline-size; display: grid; justify-items: center; }
  .deck-cards { --card: clamp(130px, 44cqi, 250px); position: relative; width: calc(var(--card) * 2.1); height: calc(var(--card) * 12 / 7 * 1.05); }
  .deck-card { position: absolute; left: calc(50% - var(--card) / 2); top: 50%; width: var(--card); padding: 0; border: 0; background: #000; box-shadow: 0 18px 40px #000c; cursor: pointer; transform: translate(calc((var(--i) - 1) * 52%), -50%); filter: brightness(.5); transition: transform .35s cubic-bezier(.215, .61, .355, 1), filter .3s; }
  .deck-card img { display: block; width: 100%; height: auto; aspect-ratio: 7 / 12; }
  /* The middle card lies over the two others, as in a hand, so that each one keeps a side to point at; the card under the pointer comes in front of all. */
  .deck-card { z-index: 1; }
  .deck-card[data-deck="1"] { z-index: 2; }
  .deck-card.is-active { z-index: 3; filter: none; transform: translate(calc((var(--i) - 1) * 52%), -50%) scale(1.05); }
  .deck-card:focus-visible { outline: 2px solid var(--color-text); outline-offset: 3px; }
  /* On a computer, each title holds on one line: its size follows the width of its column. */
  .deck-texts { container-type: inline-size; }
  .deck-text h3 { font-size: min(var(--size-title), 7.2cqi); white-space: nowrap; }
  .deck-text p { max-width: 34ch; margin-top: var(--space-2); color: var(--color-text-weak); font-size: var(--size-subtitle); }
  /* The grid of the first screen comes back in the lower half only, the mirror of the first screen, faded upwards and at the sides, and red under the pointer. */
  .band.is-textured { position: relative; isolation: isolate; }
  .band.is-textured::before, .band-fluid { --band-fade: linear-gradient(to top, #000 20%, transparent 50%); content: ""; position: absolute; z-index: -1; inset: 0; background-size: 32px 32px; pointer-events: none; }
  .band.is-textured::before { background-image: var(--grid-image); -webkit-mask-image: var(--band-fade), linear-gradient(to right, #0006, #000 26%, #000 74%, #0006); mask-image: var(--band-fade), linear-gradient(to right, #0006, #000 26%, #000 74%, #0006); -webkit-mask-composite: source-in; mask-composite: intersect; }
  .band-fluid { background-image: linear-gradient(var(--color-accent-deep) 1px, transparent 1px), linear-gradient(90deg, var(--color-accent-deep) 1px, transparent 1px); opacity: 0; transition: opacity .4s; -webkit-mask-image: var(--band-fade), radial-gradient(190px circle at var(--mx, 50%) var(--my, 50%), #000, transparent); mask-image: var(--band-fade), radial-gradient(190px circle at var(--mx, 50%) var(--my, 50%), #000, transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
  .band-fluid.is-lit { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .deck-card { transition: none; } }
  :root[data-motion="still"] .deck-card { transition: none; }

  .trust-grid { display: grid; grid-template-columns: 1fr 2fr; gap: var(--space-12); align-items: start; }
  .trust-list { display: grid; gap: var(--space-4); }
  .trust-list li { padding-top: var(--space-4); border-top: 1px solid var(--color-border); }
  .questions-list { display: grid; gap: var(--space-8); max-width: var(--width-text); scroll-margin-top: var(--space-4); }
  .questions-list p { margin-top: var(--space-2); }
  /* The questions in blood red, so that the eye finds them in the block of text (contrast 4.6:1 on the band, AA). */
  /* Larger than the small red links, so that a question reads as a title and not as a link. */
  .questions-list h3 { color: var(--color-accent); font-size: var(--size-subtitle); font-weight: 700; }
  .risk-passage { scroll-margin-top: var(--space-4); }
  /* A grey line, the grey of the Linux button: the red stays for the questions. */
  .risk-text { margin-top: var(--space-2); padding-left: var(--space-4); border-left: 2px solid var(--color-button-line); }
  .risk-text p + p { margin-top: var(--space-3); }
  #windows-alert { scroll-margin-top: var(--space-4); }

  /* The only thing a visitor must not miss after the download, and the help: no title, no steps. */
  .band-statement { margin: 0; color: var(--color-text); font-family: var(--font-title); font-size: var(--size-display); font-weight: var(--weight-title); letter-spacing: var(--tracking-title); line-height: var(--line-title); text-align: center; text-wrap: balance; }
  .band-statement span { display: block; }
  .band-statement span + span { color: var(--color-accent); }
  /* Once, when the sentence is well in sight, its lines come in from outside the screen, the first from the right, the second from the left; the band clips them.
     The band keeps its full padding, so that on a laptop the sentence starts below the first screen and its whole entry is seen. */
  .band.is-statement { overflow-x: clip; }
  .band-statement span { transition: transform 1.2s cubic-bezier(.215, .61, .355, 1); }
  .band-statement span + span { transition-delay: .12s; }
  .band-statement:not(.is-in) span { transform: translateX(100vw); }
  .band-statement:not(.is-in) span + span { transform: translateX(-100vw); }
  @media (max-width: 720px) { .band-statement { text-align: left; text-wrap: pretty; } }

  /* The legal notice: one column, its headings like the questions of the home page. */
  .legal { max-width: var(--width-text); margin: 0 auto; }
  /* The grid of the first screen, over a short area: it fades out lower down than on the home page. */
  .hero-wrap.is-legal { --grid-fade: linear-gradient(to bottom, #000 50%, transparent); }
  .legal-head { padding: var(--space-16) 0 var(--space-16); }
  .legal-head h1 { font-size: var(--size-title); text-transform: uppercase; }
  .band.legal-body { padding-top: 0; }
  .legal section + section { margin-top: var(--space-8); }
  /* Written like the questions of the home page, and the two languages of the not-found page alike: no capitals. */
  .legal h2 { text-transform: none; }
  .legal h2 { margin-bottom: var(--space-2); color: var(--color-accent); font-family: var(--font-text); font-size: var(--size-subtitle); font-weight: 700; letter-spacing: 0; }
  .legal p { margin: 0; }
  .legal p + p { margin-top: var(--space-1); }
  .legal-back { margin-top: var(--space-8); }
  .legal-back .download-button { width: fit-content; }
  /* The glow of an outlined button stays behind its text, and in front of the band. */
  .legal-back { isolation: isolate; }
  @media (min-width: 721px) { .legal-head h1 { text-align: center; } }

  /* The not-found page: both languages at once, so that it needs no link to the other one. The grid of the first
     screen, a huge 404 as a watermark behind, and the two languages one above the other, in the second half of the page. */
  .not-found { position: relative; display: flex; align-items: center; justify-content: flex-end; min-height: 520px; padding-top: var(--band-padding); padding-bottom: var(--band-padding); overflow: hidden; }
  .not-found-code { position: absolute; top: 50%; left: var(--gutter); z-index: -1; margin: 0; color: var(--color-accent-deep); font-family: var(--font-title); font-size: clamp(170px, 34vw, 480px); font-weight: var(--weight-title); letter-spacing: var(--tracking-title); line-height: 1; opacity: .15; transform: translateY(-50%); user-select: none; }
  /* This page is too short for the back-to-top button: the name goes to the edge. */
  body:has(.not-found) .footer-brand { margin-right: 0; }
  .not-found-blocks { display: grid; justify-items: start; gap: var(--space-16); width: 50%; }
  .not-found-block { display: grid; justify-items: start; isolation: isolate; }
  @media (max-width: 860px) { .not-found-blocks { width: 100%; } }
  .not-found h1, .not-found h2 { font-size: var(--size-title); }
  .not-found h2 { text-transform: none; }
  /* The sentence stays on one line, down to the small phones where it would become too small to read. */
  .not-found p.not-found-lead { margin: var(--space-3) 0 var(--space-6); color: var(--color-text-weak); font-size: min(var(--size-body), calc((100vw - 2 * var(--gutter)) / 24)); white-space: nowrap; }
  @media (max-width: 340px) { .not-found p.not-found-lead { font-size: var(--size-body); white-space: normal; } }
  @media (max-width: 720px) { .not-found-code { top: var(--space-12); left: 50%; transform: translateX(-50%); } }

  /* The donation banner, above the header: one thin line. Its link is red, white under the pointer, like the links under the download buttons; its weight, not only its hue, tells it from the grey text around it. */
  .donate { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 var(--space-4); border-bottom: 1px solid var(--color-border); background: var(--color-background); color: var(--color-text-faint); font-size: var(--size-label); line-height: 1.2; text-align: center; }
  .donate-text { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
  .donate .donate-link { color: var(--color-accent); font-weight: 700; text-decoration: none; }
  .donate .donate-link:hover, .donate .donate-link:focus-visible { color: var(--color-text); }

  /* The help: the question large and red, the answer small. The link has no underline: its white and its weight tell it from the text around it. */
  .band-statement.is-help > span:first-child { color: var(--color-accent); }

  .footer-brand { flex-direction: column; align-items: flex-end; gap: 2px; }
  .site-footer a.footer-by { color: var(--color-text-weak); font-family: var(--font-text); font-size: var(--size-label); font-weight: var(--weight-text); letter-spacing: 0; text-transform: none; }

  .footer-brand { margin: 0 max(0px, calc(48px + var(--space-2) - (100vw - min(100vw, var(--width-content) + 2 * var(--gutter))) / 2)) 0 auto; }

  function sizeDevice() {
    const stage = document.getElementById("stage");
    const device = document.getElementById("device");
    const frame = document.getElementById("frame");
    const size = DEVICES[chosen.device];
    stage.classList.toggle("is-fill", !size.width);
    if (!size.width) {
      device.style.cssText = "";
      frame.style.cssText = "";
      return;
    }
    const scale = Math.min(1, (stage.clientWidth - 24) / size.width);
    frame.style.cssText = `width:${size.width}px;height:${size.height}px;transform:scale(${scale})`;
    device.style.cssText = `width:${size.width * scale}px;height:${size.height * scale}px`;
  }

  if (isEmbed) {
    document.body.className = "is-page";
    renderPage();
    window.addEventListener("resize", renderPage);
    window.addEventListener("scroll", showTop, { passive: true });
    // The red grid under the pointer, on the first screen and in the block What it does, and never with reduced motion.
    document.documentElement.addEventListener("mouseleave", () => document.querySelectorAll(".hero-fluid, .band-fluid").forEach(fluid => fluid.classList.remove("is-lit")));
    document.addEventListener("pointermove", event => {
      if (event.pointerType !== "mouse" || isStill()) return;
      document.querySelectorAll(".hero-fluid, .band-fluid").forEach(fluid => {
        const box = fluid.getBoundingClientRect();
        const isInside = event.clientY >= box.top && event.clientY <= box.bottom;
        fluid.classList.toggle("is-lit", isInside);
        if (!isInside) return;
        fluid.style.setProperty("--mx", `${event.clientX - box.left}px`);
        fluid.style.setProperty("--my", `${event.clientY - box.top}px`);
      });
    });
    document.addEventListener("click", event => {
      const pickFromPage = (key, value) => window.parent !== window ? window.parent.setChoice(key, value) : window.applyChoices({ [key]: value });
      if (event.target.closest(".media-pause")) return pickFromPage("motion", "reduced");
      if (event.target.closest(".media-play")) return pickFromPage("motion", "normal");
      const anchor = event.target.closest("a");
      if (!anchor) return;
      if (anchor.dataset.page) {
        event.preventDefault();
        if (anchor.dataset.goLang) pickFromPage("lang", anchor.dataset.goLang);
        pickFromPage("page", anchor.dataset.page);
        scrollTo(0, 0);
        return;
      }
      const lang = anchor.dataset.otherLanguage;
      if (lang) {
        event.preventDefault();
        pickFromPage("lang", lang);
      } else if (anchor.getAttribute("href") === "#") {
        event.preventDefault();
        if (anchor.dataset.toTop !== undefined) scrollTo(0, 0);
      }
    });
  } else {
    renderShell();
  }
</script>
</body>
